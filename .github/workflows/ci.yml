name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,clickhouse,duckdb,mcp,snowflake,bigquery]" fakesnow

      - name: Run unit tests
        run: pytest -m "not integration"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check detectkit

      - name: Black
        run: black --check detectkit

      - name: Mypy
        run: mypy detectkit
        continue-on-error: true  # mypy strict mode is aspirational; do not block PRs yet

  website:
    # Gate the browser surfaces that ship in the wheel: the TS detector port
    # (report/tune/playground) must still match the real Python detectors, and the
    # committed generated bundles (report.js / tune.js / ui.js) + golden.json must
    # be in sync with their TypeScript / Python sources. These were release-checklist
    # steps run by hand; making them a code-enforced gate is what keeps the landing
    # playground — now a literal instance of the `dtk tune` cockpit — from silently
    # drifting from the shipped product.
    name: Website bundles & detector parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detectkit (for the golden generator)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website deps
        working-directory: website
        run: npm ci

      # Freeze the real Python detectors' output, then assert the TS port reproduces
      # it (bands within a scale-aware 1e-6) and the tune worker's alert-fire semantics.
      - name: Regenerate golden parity vectors
        run: python website/scripts/gen-demo-golden.py

      - name: Detector port parity (TS ↔ Python)
        working-directory: website
        run: npm run check

      # Rebuild every committed bundle from source; the diff-guard below then fails
      # if any shipped .js (or golden.json) was left stale relative to its source.
      - name: Regenerate committed bundles (report / tune / ui)
        working-directory: website
        run: npm run build:bundles

      - name: Fail if any committed artifact is stale
        run: |
          git diff --stat -- \
            website/src/scripts/demo/golden.json \
            detectkit/reporting/assets/report.js \
            detectkit/tuning/assets/tune.js \
            detectkit/ui/assets/ui.js
          git diff --exit-code -- \
            website/src/scripts/demo/golden.json \
            detectkit/reporting/assets/report.js \
            detectkit/tuning/assets/tune.js \
            detectkit/ui/assets/ui.js
