[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detectkit"
dynamic = ["version"]
description = "Metric monitoring with automatic anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "detectkit team"}
]
keywords = ["monitoring", "anomaly-detection", "metrics", "timeseries", "alerting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "jinja2>=3.0",
    "orjson>=3.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# Database drivers
clickhouse = ["clickhouse-driver>=0.2.0"]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.0.0"]
all-db = ["clickhouse-driver>=0.2.0", "psycopg2-binary>=2.9.0", "pymysql>=1.0.0"]

# Advanced detectors
prophet = ["prophet>=1.1.0"]
timesfm = ["timesfm>=0.1.0"]
advanced-detectors = ["prophet>=1.1.0", "timesfm>=0.1.0"]

# OSI (Open Semantic Interchange) interop — sqlglot for ANSI->ClickHouse
# transpilation in `dtk osi import/compile` (clickhouse target). Optional: the
# core library and the rest of the CLI never import sqlglot.
osi = ["sqlglot>=20.0"]

# All extras
all = [
    "clickhouse-driver>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
    "prophet>=1.1.0",
    "timesfm>=0.1.0",
    "sqlglot>=20.0",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "requests-mock>=1.12",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "sqlglot>=20.0",
]
# Integration tests (require Docker)
integration = [
    "testcontainers[clickhouse,postgres,mysql]>=4.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
]

[project.scripts]
dtk = "detectkit.cli.main:cli"

[project.urls]
Homepage = "https://dtk.pipelab.dev"
Documentation = "https://dtk.pipelab.dev"
Repository = "https://github.com/alexeiveselov92/detectkit"
Changelog = "https://github.com/alexeiveselov92/detectkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/alexeiveselov92/detectkit/issues"

[tool.setuptools.dynamic]
version = {attr = "detectkit.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["detectkit*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# Claude Code context shipped by `dtk init-claude` (CLAUDE block, rules, skills).
"detectkit.cli" = ["assets/**/*.md"]
# Pre-built HTML-report renderer bundle (shared with the website landing demo),
# inlined into self-contained reports by `dtk run --report` / `dtk autotune --report`.
"detectkit.reporting" = ["assets/*.js"]
# Pre-built interactive tuning renderer bundle (shared detector port + chart core),
# inlined into the self-contained tuning page by `dtk tune`.
"detectkit.tuning" = ["assets/*.js"]
# Pre-built project-cockpit renderer bundle, inlined into the page served by `dtk ui`.
"detectkit.ui" = ["assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=detectkit",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require external services)",
    "slow: Slow running tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "clickhouse_driver.*",
    "orjson.*",
    "requests.*",
    "psycopg2.*",
    "pymysql.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
